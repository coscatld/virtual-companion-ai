spring.application.name=VR_Gfriend
server.port=${PORT:8080}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

spring.datasource.url=${GA_MYSQL_URL:jdbc:mysql://127.0.0.1:3306/aigf?serverTimezone=UTC}
spring.datasource.username=${GA_MYSQL_USER:ga}
spring.datasource.password=${GA_MYSQL_PASSWORD:}
spring.sql.init.mode=${GA_DB_INIT_MODE:always}
mybatis-plus.mapper-locations=classpath:mapper/*.xml

ga.auth.jwt-secret=${GA_JWT_SECRET:}
ga.web.allowed-origins=${GA_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
ga.internal-token=${GA_INTERNAL_TOKEN:}
ga.enterprise.redis-url=${GA_ENTERPRISE_REDIS_URL:}
ga.enterprise.text-requests-per-minute=${GA_ENTERPRISE_TEXT_REQUESTS_PER_MINUTE:30}
ga.enterprise.voice-turns-per-minute=${GA_ENTERPRISE_VOICE_TURNS_PER_MINUTE:12}
ga.briefing.timezone=${GA_BRIEFING_TIMEZONE:Asia/Shanghai}
spring.task.scheduling.pool.size=2
grpc.client.agentService.address=${GA_AGENT_GRPC_ADDRESS:static://127.0.0.1:7000}
grpc.client.agentService.negotiation-type=${GA_AGENT_GRPC_NEGOTIATION:PLAINTEXT}
grpc.client.agentService.max-inbound-message-size=10MB
